      SRE-Disponibilidade:
        json: |-
          {
            "uid": "4f1876b6-da43-4424-a3b7-3680d4cbcf48",
            "title": "SRE - Disponibilidade e Error Budget | donation-service",
            "tags": [
              "SolidaryTech",
              "SRE",
              "SLI",
              "SLO",
              "donation-service",
              "Error Budget"
            ],

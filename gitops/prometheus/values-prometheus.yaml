                "type": "stat",
                "title": "SLI - Disponibilidade (5m)",
                "description": "Percentual de requisições ao handler donations que não retornaram HTTP 5xx nos últimos 5 minutos. SLO: >= 99,5%.",
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "gridPos": {
                  "x": 0,
                  "y": 0,
                  "w": 6,
                  "h": 7
                },
                "targets": [
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "prometheus"
                    },
                    "editorMode": "code",
                    "expr": "100 * sum(rate(http_requests_total{service=\"donation-service\",handler=\"donations\",code!~\"5..\"}[5m])) / sum(rate(http_requests_total{service=\"donation-service\",handler=\"donations\"}[5m]))",
                    "legendFormat": "Disponibilidade",
                    "refId": "A",
                    "instant": false,
                    "range": true
                  }
                ],
                "fieldConfig": {
                  "defaults": {
                    "unit": "percent",
                    "color": {
                      "mode": "thresholds"
                    },
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
                          "value": null
                        },
                        {
                          "color": "green",
                          "value": 99.5
                        }
                      ]
                    },
                    "decimals": 2,
                    "min": 0,
                    "max": 100
                  },
                  "overrides": []
                },
                "options": {
                  "colorMode": "value",
                  "graphMode": "area",
                  "justifyMode": "center",
                  "orientation": "auto",
                  "textMode": "value_and_name",

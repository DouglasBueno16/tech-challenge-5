grafana:
  # Crie antes o secret: kubectl -n <ns> create secret generic grafana-discord-webhook --from-literal=DISCORD_WEBHOOK_URL='<nova-url>'
  envFromSecret: grafana-discord-webhook
  persistence:
    enabled: true
    existingClaim: grafana-pvc
  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: '1'
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: '1'
  alerting:
    contactpoints.yaml:
      apiVersion: 1
      contactPoints:
      - orgId: 1
        name: Discord
        receivers:
        - uid: cfw98x5y7241sc
          type: discord
          settings:
            url: $DISCORD_WEBHOOK_URL
            use_discord_username: false
            use_embed_description: false
          disableResolveMessage: false
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
  dashboards:
    default:

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: donation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: donationdb
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d donationdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: donation-datadog-agent
    restart: unless-stopped
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_EXCLUDE_LOGS=name:donation-datadog-agent
    ports:
      - "8126:8126/tcp"    # APM Trace Agent
      - "8125:8125/udp"    # DogStatsD
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  donation-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: donation-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      datadog-agent:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/donationdb?sslmode=disable
      - DD_AGENT_HOST=datadog-agent
      - DD_TRACE_AGENT_PORT=8126
      - DD_SERVICE=donation-service
      - DD_ENV=local
      - DD_VERSION=1.0.0
      - DD_TRACE_ANALYTICS_ENABLED=true
      - DD_TRACE_DEBUG=true
      - DD_PROFILING_ENABLED=true
      - DD_LOGS_INJECTION=true
      - DD_RUNTIME_METRICS_ENABLED=true
      - OTEL_SERVICE_NAME=donation-service
      - DD_TRACE_OTLP_ENABLED=true
      - DD_TRACE_PROPAGATION_STYLE=tracecontext,datadog
    labels:
      tags.datadoghq.com/service: "donation-service"
      tags.datadoghq.com/version: "1.0.0"
      tags.datadoghq.com/env: "local"

volumes:
  pgdata:

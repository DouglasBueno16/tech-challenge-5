terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    env:
      TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    environment:
      name: production-destroy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Terraform init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=togglemaster/fase3/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"


      - name: Limpar Applications do ArgoCD
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true
        run: |
          CLUSTER=$(terraform output -raw cluster_name 2>/dev/null || echo "")
          if [ -n "$CLUSTER" ]; then
            aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER"
            echo "Removendo Applications do ArgoCD..."
            kubectl delete applications --all -n argocd --timeout=120s || true
            echo "Aguardando 30s para garbage collection..."
            sleep 30
          else
            echo "Cluster não encontrado no state — nada para limpar."
          fi

      - name: Gerar terraform.tfvars
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          cat > terraform.tfvars <<EOF
          aws_region            = "${{ env.AWS_REGION }}"
          gitops_repo_url       = "${{ github.server_url }}/${{ github.repository }}.git"
          aws_access_key_id     = "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws_secret_access_key = "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws_session_token     = "${{ secrets.AWS_SESSION_TOKEN }}"
          EOF

      - name: Terraform destroy
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform destroy -auto-approve
